<div
  class="door-wrapper"
  [class.lit]="isOpen() || keepClose()"
  [class.burst]="lightBurst()"
  [class.heiligabend]="no() === 24"
>
  <div #door class="backDoor">
    <!-- warmes Licht hinter der Tür (auch durch den Spalt einer nur kurz aufgehenden Tür) -->
    <div
      class="door-glow"
      [class.visible]="isOpen() || keepClose()"
      [class.burst]="lightBurst()"
      aria-hidden="true"
    ></div>
    @for (spark of sparks(); track spark.id) {
      <span
        class="spark"
        aria-hidden="true"
        [style.left.%]="spark.x"
        [style.animation-delay.ms]="spark.delay"
        [style.animation-duration.ms]="spark.duration"
        [style.--drift]="spark.drift + 'px'"
        [style.--size]="spark.size + 'px'"
      ></span>
    }
    @if (isOpen()) {
      <div
        class="text-container"
        style="display: flex; flex-direction: column; justify-content: space-around; text-align: center; height: 100%;"
        >
        @for (gewinn of tagesGewinne(); track gewinn.Id) {
          <div [class.my-win]="isMine(gewinn)">
            @if (gewinn.Losnummer > 0) {
              <div class="losnummer">
                <strong>Kalender {{ pad(gewinn.Losnummer, 4) }}</strong>
                @if (isMine(gewinn)) {
                  <span class="my-win-badge" title="Ihre Kalendernummer">★</span>
                }
              </div>
            }
            <div>{{ gewinn.Beschreibung }}</div>
          </div>
        }
      </div>
    }
    <div
      class="doorHinge"
      (click)="toggle()"
      [class.doorOpen]="isOpen()"
      [class.doorClose]="!isOpen() && keepClose()"
      >
      <div class="doorInsideCover"></div>
      <div #doorFace class="door" [attr.data-no]="no()">
        <!-- die Tür zeigt einen Ausschnitt des Bildes - die Lichter darin sollen auch funkeln -->
        <app-twinkle-lights class="on-door" />
      </div>
    </div>
  </div>
</div>
