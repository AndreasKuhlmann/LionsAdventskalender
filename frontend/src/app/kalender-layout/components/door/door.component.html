<div class="door-wrapper">
  <div #door class="backDoor">
    @if (isOpen()) {
      <div
        class="text-container"
        style="display: flex; flex-direction: column; justify-content: space-around; text-align: center; height: 100%;"
        >
        @for (gewinn of tagesGewinne(); track gewinn.Id) {
          <div [class.my-win]="isMine(gewinn)">
            @if (gewinn.Losnummer > 0) {
              <div class="losnummer">
                <strong>Kalender {{ pad(gewinn.Losnummer, 4) }}</strong>
                @if (isMine(gewinn)) {
                  <span class="my-win-badge" title="Ihre Kalendernummer">★</span>
                }
              </div>
            }
            <div>{{ gewinn.Beschreibung }}</div>
          </div>
        }
      </div>
    }
    <div
      class="doorHinge"
      (click)="toggle()"
      [class.doorOpen]="isOpen()"
      [class.doorClose]="!isOpen() && keepClose()"
      >
      <div class="doorInsideCover"></div>
      <div #doorFace class="door" [attr.data-no]="no()"></div>
    </div>
  </div>
</div>
