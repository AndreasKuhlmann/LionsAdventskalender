<mat-toolbar color="primary" class="sticky">
  <img
    style="height: 100%"
    style="max-height: 100%"
    src="/assets/lions.png"
    alt="Lions Club"
    />

    <span style="margin-left: 0.5em">Oldenburger Adventskalender</span>

    <span class="example-spacer"></span>
    <div>
      @if (showInstallButton()) {
        <button mat-icon-button color="accent" (click)="installApp()" matTooltip="Installieren">
          @if (isDesktop) {
            <mat-icon>install_desktop</mat-icon>
          }
          @if (!isDesktop) {
            <mat-icon >install_mobile</mat-icon>
          }
        </button>
      }
      @if (twinkleLights.editorAvailable) {
        <!-- nur lokal mit "ng serve" sichtbar -->
        <button
          mat-icon-button
          (click)="twinkleLights.toggleEditMode()"
          [class.editor-active]="twinkleLights.editMode()"
          [matTooltip]="twinkleLights.editMode() ? 'Lichter-Einrichtung beenden' : 'Lichter einrichten (nur lokal)'"
          aria-label="Lichter einrichten"
          [attr.aria-pressed]="twinkleLights.editMode()"
          >
          <mat-icon>auto_awesome</mat-icon>
        </button>
      }
      <button
        mat-icon-button
        (click)="winner.editNumbers()"
        [matTooltip]="myNumberLabel()"
        [attr.aria-label]="myNumberLabel()"
        >
        <mat-icon
          [matBadge]="myNumberCount()"
          [matBadgeHidden]="myNumberCount() === 0"
          matBadgeColor="accent"
          matBadgeSize="small"
          aria-hidden="true"
          >confirmation_number</mat-icon
        >
      </button>
      <button mat-icon-button [matMenuTriggerFor]="menu" aria-label="Menü">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="openZweckDialog()">
          Für einen guten Zweck
        </button>
        <button mat-menu-item (click)="openFoerdererDialog()">
          Die Förderer
        </button>
        <button mat-menu-item (click)="werStehtDahinterDialog()">
          Wer steht dahinter?
        </button>
        <button mat-menu-item (click)="openImpressumDialog()">Impressum</button>
      </mat-menu>
    </div>
  </mat-toolbar>
